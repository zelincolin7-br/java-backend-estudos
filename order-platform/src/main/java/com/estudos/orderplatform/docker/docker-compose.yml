version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: order-platform-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=order_platform_db
      - POSTGRES_USER=order_user
      - POSTGRES_PASSWORD=order_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: