spring:
  # RabbitMQ reativado para os testes com Testcontainers
  rabbitmq:
    listener:
      simple:
        default-requeue-rejected: false # Força envio para a DLQ em caso de erro no listener

  datasource:
    url: jdbc:h2:mem:order_platform_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

management:
  health:
    rabbit:
      enabled: false