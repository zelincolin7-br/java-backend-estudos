name: Order Platform CI/CD Pipeline

on:
  workflow_dispatch: # Permite disparar manualmente na aba Actions
  push:
    branches: [ develop, staging, main, master ]
  pull_request:
    branches: [ develop, staging, main, master ]

jobs:
  code-quality:
    name: Build, Test & Quality Gate (SonarQube)
    runs-on: self-hosted

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar, Executar Testes e Enviar para o SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn clean verify sonar:sonar \
            -Dsonar.projectKey=order-platform-api \
            -Dsonar.projectName="Order Platform API" \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.qualitygate.wait=true

  deploy-dev:
    name: Deploy - Ambiente DEV
    needs: code-quality
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: self-hosted
    environment: development
    steps:
      - name: Checkout do Código no Servidor (Dev)
        uses: actions/checkout@v4     

      - name: Realizar Deploy e Subir Containers em Dev
        working-directory: /home/lincoln/www/order-platform
        run: |
          cp /home/lincoln/www/order-platform/.env .env
          docker compose --env-file .env down
          docker compose --env-file .env up -d --build

  deploy-test:
    name: Deploy - Ambiente TEST
    needs: code-quality
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    runs-on: self-hosted
    environment: testing
    steps:
      - name: Checkout do Código no Servidor (Test)
        uses: actions/checkout@v4      

      - name: Realizar Deploy e Subir Containers em Test
        working-directory: /home/lincoln/www/order-platform
        run: |
          cp /home/lincoln/www/order-platform/.env .env
          docker compose --env-file .env down
          docker compose --env-file .env up -d --build

  deploy-prod:
    name: Deploy - Ambiente PROD
    needs: code-quality
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    runs-on: self-hosted
    environment: production
    steps:
      - name: Checkout do Código no Servidor (Prod)
        uses: actions/checkout@v4

      - name: Realizar Deploy e Subir Containers em Prod
        working-directory: /home/lincoln/www/order-platform
        run: |
          cp /home/lincoln/www/order-platform/.env .env
          docker compose --env-file .env down
          docker compose --env-file .env up -d --build