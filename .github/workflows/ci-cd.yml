name: Order Platform CI/CD Pipeline

on:
  workflow_dispatch: # Permite disparar manualmente na aba Actions
  push:
    branches: [ develop, staging, main, master ]
  pull_request:
    branches: [ develop, staging, main, master ]

jobs:
  code-quality:
    name: Build, Test & Quality Gate (SonarQube)
    runs-on: self-hosted

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar, Executar Testes e Enviar para o SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn clean verify sonar:sonar \
            -Dsonar.projectKey=order-platform-api \
            -Dsonar.projectName="Order Platform API" \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.qualitygate.wait=true

  deploy-dev:
    name: Deploy - Ambiente DEV
    needs: code-quality
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: self-hosted
    environment: development
    steps:
      - name: Gerar arquivo .env no servidor
        run: |
          cat << EOF > /home/lincoln/www/order-platform/.env
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          RABBITMQ_USER=${{ secrets.RABBITMQ_USER }}
          RABBITMQ_PASS=${{ secrets.RABBITMQ_PASS }}
          NEW_RELIC_LICENSE_KEY=${{ secrets.NEW_RELIC_LICENSE_KEY }}
          APP_PORT=8080
          CONTAINER_NAME=order-platform-api
          EOF

      - name: Realizar Deploy e Subir Containers em Dev
        working-directory: /home/lincoln/www/order-platform
        run: |
          docker compose down
          docker compose up -d --build

  deploy-test:
    name: Deploy - Ambiente TEST
    needs: code-quality
    if: github.ref == 'refs/staging' && github.event_name == 'push'
    runs-on: self-hosted
    environment: testing
    steps:
      - name: Realizar Deploy em Test
        run: echo "Executando processo de deploy no ambiente de HOMOLOGAÇÃO..."

  deploy-prod:
    name: Deploy - Ambiente PROD
    needs: code-quality
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    runs-on: self-hosted
    environment: production
    steps:
      - name: Realizar Deploy em Prod
        run: echo "Executando processo de deploy no ambiente de PRODUÇÃO..."